services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nossozelo
      POSTGRES_USER: nossozelo
      POSTGRES_PASSWORD: nossozelo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nossozelo -d nossozelo"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://nossozelo:nossozelo@postgres:5432/nossozelo?schema=public
      JWT_SECRET: troque-por-uma-chave-com-pelo-menos-32-caracteres
      FRONTEND_URL: http://localhost:3000
      BACKEND_PUBLIC_URL: http://localhost:4000
      ALLOWED_ORIGINS: http://localhost:3000
      PAYMENT_GATEWAY: disabled
      ENABLE_ADMIN_CRUD: "false"
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/server.js"

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
